<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" width="1600" height="1600" role="img" aria-label="XR Guild lens texture">
<title>XR Guild lens texture</title>
<defs>
  <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#08070F"/><stop offset="28%" stop-color="#181143"/><stop offset="52%" stop-color="#3B2E86"/><stop offset="72%" stop-color="#2F7FA8"/><stop offset="88%" stop-color="#5CE1F2"/><stop offset="100%" stop-color="#C3CADE"/></linearGradient>
  <filter id="swirl" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0012 0.0019" numOctaves="5" seed="23" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="506" xChannelSelector="R" yChannelSelector="G" result="warp"/>
    <feGaussianBlur in="warp" stdDeviation="15" result="soft"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="2" seed="28" result="fine"/>
    <feDisplacementMap in="soft" in2="fine" scale="31" xChannelSelector="R" yChannelSelector="B"/>
  </filter>
</defs>
<rect width="1600" height="1600" fill="#181143"/>
<g filter="url(#swirl)">
  <rect x="-480" y="-480" width="2560" height="2560" fill="url(#iris)"/>
  <ellipse cx="544" cy="480" rx="512" ry="448" fill="#5CE1F2" opacity="0.5"/>
  <ellipse cx="1184" cy="928" rx="480" ry="512" fill="#6E5BD0" opacity="0.55"/>
  <ellipse cx="800" cy="1440" rx="640" ry="384" fill="#181143" opacity="0.8"/>
  <ellipse cx="224" cy="1152" rx="352" ry="320" fill="#2F7FA8" opacity="0.5"/>
</g>
<rect width="1600" height="1600" fill="#08070F" opacity="0.34"/>
</svg>
