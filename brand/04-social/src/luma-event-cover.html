<!doctype html><html lang="en"><meta charset="utf-8">
<title>XR Guild — Luma event cover</title>
<link rel="stylesheet" href="_social.css">
<style>
  /* Luma displays covers square (1:1) and asks for at least 800px.
     1200 gives headroom for retina without bloating the upload. */
  html, body, .canvas { width: 1200px; height: 1200px; }
  .body { padding: 88px; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .mark { width: 190px; }
  .no { font-family: var(--xrg-detail); font-size: 26px; color: var(--xrg-silver);
        letter-spacing: var(--xrg-detail-track); text-align: right; line-height: 1.5; }
  .middle { margin-top: auto; }
  .eyebrow { font-size: 28px; margin-bottom: 28px; }
  .invite { font-size: 118px; max-width: 15ch; }
  .where { font-size: 34px; margin-top: 44px; line-height: 1.55; }
  .barrier { font-size: 30px; padding: 18px 34px; margin-top: 48px; }
</style>
<body>
<div class="canvas">
  <img class="tex" src="../../08-texture/lens-texture-01.svg" alt="">
  <div class="shade"></div>
  <div class="body">
    <div class="top">
      <img class="mark" src="../../01-logos/xr-guild-wordmark-stacked-white.svg" alt="XR Guild">
      <div class="no">DEMO NIGHT<br>NO. 12</div>
    </div>
    <div class="middle">
      <div class="eyebrow">Everyone gets a turn</div>
      <h1 class="invite">Come try something you have never worn.</h1>
      <div class="where">Thursday 18 September · 7:00–10:00 PM<br>The Fold, 114 Grand Street</div>
      <div class="barrier">Free · Beginners welcome · Headsets provided</div>
    </div>
  </div>
</div>
</body></html>
